[package]
name    = "reasoning-receipt-aomi-audit"
version = "0.1.0"
edition = "2024"
publish = false

# This folder is its own workspace root, so Aomi's platform build finds
# Cargo.lock beside it (see the comment in the repository-root Cargo.toml).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk   = "=5.1.1"
schemars   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
serde_json = "1"
reqwest = { version = "0.12", default-features = false }
