name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff
        run: uv run --extra dev ruff check .
      - name: Pytest
        run: uv run --extra dev pytest tests/ -q
        env:
          RR_MOCK_X402: "1"
          RR_MOCK_CHAIN: "1"
          RR_MOCK_IRYS: "1"
          RR_MOCK_ANALYST: "1"
          RR_MOCK_SCANNER: "1"
          RR_MOCK_TRADER: "1"
          RR_MOCK_CIRCLE: "1"

  contracts:
    name: forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pin to avoid rate-limited "latest tag" lookup against GitHub API.
          version: v1.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install forge-std
        run: |
          if [ ! -d contracts/lib/forge-std ]; then
            git clone --depth 1 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          fi
      - name: forge build
        working-directory: contracts
        run: forge build
      - name: forge test
        working-directory: contracts
        run: forge test -vv

  dashboard:
    name: next build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Typecheck
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Build (server mode)
        working-directory: dashboard
        run: npx next build

  protocol:
    name: conformance + cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install Python deps
        run: uv sync --extra dev --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - name: Python conformance corpus
        run: uv run --extra dev python -m protocol.cli conformance
      - name: Fuzz harness (seeded)
        run: uv run --extra dev python scripts/fuzz/fuzz.py --iterations 300
      - name: TypeScript SDK tests
        working-directory: sdks/typescript
        run: npm ci && npm test
      - name: Rust SDK tests
        working-directory: sdks/rust
        run: cargo test
      - name: Emit parity receipts (py / ts / rs)
        run: |
          uv run python scripts/parity/emit.py conformance/parity/py.receipt.json
          node sdks/typescript/scripts/emit-parity.mjs conformance/parity/ts.receipt.json
          cd sdks/rust && cargo run --example emit_parity -- ../../conformance/parity/rs.receipt.json
      - name: Cross-verify parity (python)
        run: uv run python scripts/parity/check.py
      - name: Cross-verify parity (typescript)
        run: node sdks/typescript/scripts/check-parity.mjs
      - name: Cross-verify parity (rust)
        working-directory: sdks/rust
        run: cargo run --example check_parity
